name: Build MaintFlow standalone release

on:
  push:
    branches: [feature/employee-number-auth]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: maintflow-build-staging
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify build configuration
        id: configuration
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync } from 'node:fs'
          const { NEXT_PUBLIC_SUPABASE_URL: url, NEXT_PUBLIC_SUPABASE_ANON_KEY: key,
            GITHUB_EVENT_NAME: event, GITHUB_ENV: env, GITHUB_OUTPUT: output } = process.env
          const staging = 'https://dmrmqrtjmpeyoekicctp.supabase.co'
          if (!url && !key && event === 'push') {
            appendFileSync(env, 'NEXT_PUBLIC_SUPABASE_URL=https://example.invalid\nNEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_build_smoke\n')
            appendFileSync(output, 'target=smoke\n')
            process.exit(0)
          }
          if (url !== staging || !key?.trim()) throw Error('Set the known staging URL and public client key.')
          if (key.startsWith('eyJ')) {
            let role
            try { role = JSON.parse(Buffer.from(key.split('.')[1], 'base64url')).role } catch { /* handled below */ }
            if (role !== 'anon') throw new Error('A legacy Supabase JWT used in the build must have the anon role.')
          } else if (!key.startsWith('sb_publishable_')) {
            throw new Error('The Supabase key must be a publishable key or legacy anon JWT.')
          }
          const response = await fetch(`${staging}/auth/v1/settings`, { headers: { apikey: key }, signal: AbortSignal.timeout(10000) })
          if (!response.ok) throw Error('The public key was rejected by the staging project.')
          appendFileSync(output, 'target=staging\n')
          NODE

      - name: Install and check
        run: |
          npm ci --include=dev
          npm run lint -- --max-warnings=0
          npx --no-install next typegen
          npx --no-install tsc --noEmit
          python3 -B -m unittest discover -s deployment/pull -p test_deploy.py

      - name: Build, package, and smoke-test the extracted release
        env:
          RELEASE_TARGET: ${{ steps.configuration.outputs.target }}
        run: |
          npm run build
          npm run package:standalone
          mkdir -p build/artifacts
          extracted="$(mktemp -d "$RUNNER_TEMP/maintflow.XXXXXX")"
          name="maintflow-${RELEASE_TARGET}-${GITHUB_SHA}-linux-$(node -p 'process.arch').tar.gz"
          tar -C build/standalone-release -czf "build/artifacts/$name" .
          (cd build/artifacts && sha256sum "$name" > "$name.sha256")
          PYTHONPATH=deployment/pull python3 -B -c 'from pathlib import Path; from deploy_release import unpack; import sys; unpack(Path(sys.argv[1]), Path(sys.argv[2]))' "build/artifacts/$name" "$extracted"
          SKIP_AUTH_ORIGIN_SMOKE=1 node deployment/smoke-standalone.mjs "$extracted"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maintflow-${{ steps.configuration.outputs.target }}-${{ github.sha }}-linux
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14
